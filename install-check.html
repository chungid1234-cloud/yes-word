<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#304b3d"><link rel="manifest" href="./manifest.webmanifest?v=27"><title>YES WORD 설치 진단</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f7f5ef;color:#222b25;max-width:580px;margin:24px auto;padding:0 16px}section{background:white;padding:18px;border-radius:16px;margin:12px 0}button,a{display:inline-block;padding:12px;color:#304b3d}button{font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 monospace}.ok{color:#306343}</style><script>let installEvent=null,installed=false;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;window.dispatchEvent(new Event('yes-install-state'))});window.addEventListener('appinstalled',()=>{installed=true;installEvent=null;window.dispatchEvent(new Event('yes-install-state'))});</script></head><body><h1>YES WORD 설치 진단</h1><p>이 화면은 학습 기록을 변경하거나 삭제하지 않습니다.</p><section><p id="status">Chrome 설치 신호 대기 중</p><button id="install" disabled>앱 설치</button><p><a href="./">YES WORD 열기</a></p></section><section><pre id="out">검사 중…</pre><button id="copy">진단 결과 복사</button><button onclick="location.reload()">다시 검사</button></section><script>
const out=document.getElementById('out'),button=document.getElementById('install');const rows=new Map();function line(k,v){rows.set(k,v);out.textContent=Array.from(rows,([a,b])=>a+': '+b).join('\n')}function installState(){button.disabled=!installEvent;document.getElementById('status').textContent=installed?'설치 완료 이벤트 수신':installEvent?'Chrome 설치 가능 신호 수신':'아직 Chrome 설치 신호 없음';line('beforeinstallprompt',installEvent?'received':installed?'installed':'not received yet')}window.addEventListener('yes-install-state',installState);button.onclick=async()=>{if(!installEvent)return;try{let e=installEvent;await e.prompt();let c=await e.userChoice;line('install choice',c.outcome);installEvent=null;installState()}catch(e){line('install error',String(e))}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);document.getElementById('copy').textContent='복사 완료'}catch{window.prompt('진단 결과 복사',out.textContent)}};installState();
(async()=>{line('진단 버전','2026-11-23 / 1');line('URL',location.href);line('secure context',isSecureContext);line('online',navigator.onLine);line('standalone',matchMedia('(display-mode: standalone)').matches);line('browser',navigator.userAgent);try{let res=await fetch('./manifest.webmanifest?v=27',{cache:'reload'});line('manifest HTTP',res.status+' / '+res.headers.get('content-type'));let m=await res.json();line('manifest',m.name+' / '+m.display+' / '+m.start_url+' / '+m.scope);for(let i of m.icons||[]){try{let url=new URL(i.src,res.url);let resp=await fetch(url,{cache:'reload'});let blob=await resp.blob();let img=await createImageBitmap(blob);line('icon '+i.sizes,resp.status+' / '+blob.type+' / '+img.width+'x'+img.height);img.close()}catch(e){line('icon '+i.sizes,'ERROR '+e.message)}}let start=await fetch(new URL(m.start_url,res.url),{cache:'reload'});line('start URL',start.status+' / '+start.url)}catch(e){line('manifest/start error',String(e))}try{if(!navigator.serviceWorker)throw Error('unsupported');let reg=await navigator.serviceWorker.getRegistration();line('worker',reg?'scope '+reg.scope:'not registered');line('active worker',reg?.active?.state||'none');line('controller',navigator.serviceWorker.controller?.state||'none');let keys=await caches.keys();line('offline caches',keys.join(', ')||'none');if(reg){let c=await caches.open('yes-word-v27');let checks=await Promise.all(['./','./index.html','./style.css?v=27','./app.js?v=27','./gate.js?v=27','./manifest.webmanifest?v=27','./icon-192.png?v=3','./icon-512.png?v=3'].map(x=>c.match(new URL(x,location.href))));line('offline assets',checks.filter(Boolean).length+'/8')}}catch(e){line('worker error',String(e))}})();
</script></body></html>

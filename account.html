<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#304b3d"><title>YES WORD · 계정</title><link rel="stylesheet" href="style.css?v=4"><style>[hidden]{display:none!important}.account-wrap{max-width:440px;margin:auto;padding:32px 20px}.account-tabs{display:flex;gap:8px;margin:18px 0}.account-tabs button{flex:1}.account-tabs button[aria-pressed=true]{background:var(--primary);color:var(--on)}.account-wrap a{color:var(--primary)}#account-status{overflow-wrap:anywhere}</style></head><body><main class="account-wrap"><div class="welcome-brand"><div class="brand-mark"><span style="font-size:28px">✧</span><span>YES WORD</span></div><h1>YES WORD<span>.</span></h1><p class="welcome-tagline">말씀을 마음에 새기다</p></div><section class="card"><h2>내 계정</h2><p id="account-status" role="status">인증 연결 확인 중…</p><form id="account-form" class="profile-form"><div class="account-tabs"><button type="button" data-mode="login">로그인</button><button type="button" data-mode="signup">회원가입</button></div><div id="signup-fields" hidden><label for="account-name">이름</label><input id="account-name" maxlength="40" autocomplete="name"><label for="account-affiliation">소속</label><select id="account-affiliation"><option>YES 청년부 · 새일꾼반</option><option>YES 청년부</option><option>개인 / 기타</option></select></div><label for="account-email">이메일</label><input id="account-email" type="email" required autocomplete="email"><label for="account-password">비밀번호</label><input id="account-password" type="password" minlength="8" required><button id="account-submit" class="primary full" type="submit">로그인</button></form><div id="account-logged" hidden><p id="identity"></p><p id="saved-name"></p><button id="account-signout" class="outline full">로그아웃</button></div><p class="privacy-note">이 단계에서는 계정과 프로필만 서버에 저장합니다. 기존 암송 기록과 녹음은 아직 이 기기에 남아 있으며 계정 간 분리나 클라우드 동기화는 지원하지 않습니다. 공용 기기에서 개인 학습 데이터를 사용하지 마세요.</p><p><a href="./">← 개인 암송 앱으로 돌아가기</a></p></section></main><script src="account.js" defer></script></body></html>

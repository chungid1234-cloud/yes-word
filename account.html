<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#304b3d"><title>YES WORD · 계정</title><link rel="stylesheet" href="style.css?v=31"><style>[hidden]{display:none!important}.account-wrap{max-width:440px;margin:auto;padding:32px 20px}.account-tabs{display:flex;gap:8px;margin:18px 0}.account-tabs button{flex:1}.account-tabs button[aria-pressed=true]{background:var(--primary);color:var(--on)}.account-wrap a{color:var(--primary)}#account-status{overflow-wrap:anywhere}.account-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:4px 0}.account-divider:before,.account-divider:after{content:'';flex:1;border-top:1px solid var(--line)}</style><link rel="manifest" href="./manifest.webmanifest?v=31"><link rel="apple-touch-icon" href="./icon-192.png?v=3"><script src="./pwa-release.js?v=31" defer></script></head><body><main class="account-wrap"><div class="welcome-brand"><div class="brand-mark"><span style="font-size:28px">✧</span><span>YES WORD</span></div><h1>YES WORD<span>.</span></h1><p class="welcome-tagline">말씀을 마음에 새기다</p></div><section class="card"><h2>말씀 여정 시작하기</h2><p id="account-status" role="status">인증 연결 확인 중…</p><div id="google-panel" class="stack"><button type="button" id="google-login" class="outline full" style="display:flex;align-items:center;justify-content:center;gap:12px"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.2 5.48-4.72 7.18l7.73 6C44.46 38.03 46.98 31.88 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18L2.55 13.22a24 24 0 0 0 0 21.56z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6C30.03 37.65 27.25 38.5 24 38.5c-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google 계정으로 계속하기</button><div class="account-divider"><span>또는</span></div><button id="guest-start" type="button" class="primary full">가입 없이 시작하기</button><p class="muted">게스트는 학습 기록을 이 기기에만 저장합니다.</p></div><form id="oauth-profile" class="profile-form" hidden><label for="oauth-name">이름</label><input id="oauth-name" required maxlength="40" autocomplete="name"><label for="oauth-affiliation">소속</label><select id="oauth-affiliation"><option>YES 청년부 · 새일꾼반</option><option>YES 청년부</option><option>개인 / 기타</option></select><button class="primary full" type="submit">말씀 여정 시작하기</button></form><details hidden><summary>기존 이메일 계정으로 로그인 (임시)</summary><form id="account-form" class="profile-form"><div class="account-tabs"><button type="button" data-mode="login">로그인</button><button type="button" data-mode="signup" hidden>회원가입</button></div><div id="signup-fields" hidden><label for="account-name">이름</label><input id="account-name" maxlength="40" autocomplete="name"><label for="account-affiliation">소속</label><select id="account-affiliation"><option>YES 청년부 · 새일꾼반</option><option>YES 청년부</option><option>개인 / 기타</option></select></div><label for="account-email">이메일</label><input id="account-email" type="email" required autocomplete="email"><label for="account-password">비밀번호</label><input id="account-password" type="password" required><button id="account-submit" class="primary full" type="submit">로그인</button><button id="forgot" type="button" hidden class="outline full">비밀번호를 잊으셨나요?</button></form></details><form id="reset-form" class="profile-form" hidden><label>새 비밀번호</label><input id="new-password" type="password" autocomplete="new-password" required><label>새 비밀번호 확인</label><input id="confirm-password" type="password" autocomplete="new-password" required><button class="primary full">비밀번호 변경</button></form><div id="account-logged" hidden><p id="identity"></p><p id="saved-name"></p><button id="account-signout" class="outline full">로그아웃</button></div><p class="privacy-note">계정과 프로필은 서버에 저장됩니다. 학습 기록과 녹음은 계정별로 이 기기에 저장되며 앱의 MY 메뉴에서 선택적으로 클라우드 백업을 설정할 수 있습니다. 공용 기기에서는 사용하지 마세요.</p><p><a href="./privacy.html">개인정보 및 베타 이용 안내</a></p></section></main><script src="account-v15.js?v=17" defer></script></body></html>
